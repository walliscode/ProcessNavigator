{% macro render_field(field) %}
<fieldset>
  {{ field.label }}
  {{ field(**kwargs)|safe }}
</fieldset>
<dd>
  {% if field.errors %}
  <ul class=errors>
    {% for error in field.errors %}
    <li>{{ error }}</li>
    {% endfor %}
  </ul>
  {% endif %}
</dd>
{% endmacro %}

{% macro render_form_button(field) %}
<fieldset>
  {{ field(**kwargs)|safe }}
</fieldset>
{% endmacro %}
