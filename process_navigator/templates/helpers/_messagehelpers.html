{% macro display_messages() %}
{% with messages = get_flashed_messages(with_categories=true)%}
{% if messages %}

<div class="form-container">
  {% for category,message in messages %}
  <div class="message-box">
    <p class="{{ category }}">{{ message }}</p>
  </div>
  {% endfor %}
</div>
{% endif %}
{% endwith %}
{% endmacro %}
