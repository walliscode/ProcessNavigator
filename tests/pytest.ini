[pytest]
# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Pytest markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated, no database)
    integration: Integration tests (database access, multiple components)
    system: System tests (end-to-end, complete workflows)
    performance: Performance tests (slow, large datasets)
    smoke: Smoke tests (critical functionality, run first)
    slow: Slow tests (>5 seconds execution time)
    database: Tests requiring database access
    authentication: Authentication and authorization tests
    critical: Critical business functionality
    file_upload: Tests involving file uploads
    api: API endpoint tests (future)
    ui: UI/browser tests (future)

# Output options
addopts =
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short

# Coverage options (when using pytest-cov)
# Uncomment to enable default coverage settings
# addopts =
#     --cov=process_navigator
#     --cov-report=html
#     --cov-report=term-missing
#     --cov-fail-under=80

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Test collection settings
norecursedirs = .git .tox dist build *.egg instance

# Timeout for tests (requires pytest-timeout)
# timeout = 300
# timeout_method = thread

# Parallel execution (requires pytest-xdist)
# Run with: pytest -n auto
# addopts = -n auto

# Random order (requires pytest-random-order)
# Helps catch test interdependencies
# Run with: pytest --random-order
